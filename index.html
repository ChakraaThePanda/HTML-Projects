<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chakraa's HTML Projects</title>
<meta name="description" content="Small games and tools that run right in your browser." />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    --bg:     #101114;
    --card:   #17191e;
    --line:   #2a2d35;
    --line-hi:#454a56;
    --ink:    #ecebe7;
    --mute:   #9a9ea8;
    --f-body: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 15px;
    line-height: 1.5;
    padding: 0 16px 40px;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--mute); outline-offset: 3px; border-radius: 4px; }

  .wrap { width: min(1120px, 100%); margin: 0 auto; }

  header { padding: 44px 0 6px; }
  header h1 { font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.1rem); line-height: 1.15; margin: 0; }
  header p { margin: 6px 0 0; color: var(--mute); }

  section { margin-top: 34px; }
  section h2 { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 0 0 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }

  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .card:hover { border-color: var(--line-hi); }
  .card img { display: block; width: 100%; height: auto; aspect-ratio: 600 / 374; object-fit: cover; object-position: top; border-bottom: 1px solid var(--line); background: #000; }
  .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card h3 { margin: 0; font-weight: 700; font-size: 1.05rem; }
  /* the title link covers the whole card, so anywhere opens the project */
  .card h3 a { text-decoration: none; }
  .card h3 a::after { content: ""; position: absolute; inset: 0; }
  .card p { margin: 0; color: var(--mute); font-size: .93rem; flex: 1; }
  .card .src {
    position: relative; z-index: 1; align-self: flex-start; margin-top: 6px;
    font-size: .82rem; color: var(--mute); text-decoration: none; border-bottom: 1px dashed var(--line);
  }
  .card .src:hover { color: var(--ink); border-color: var(--mute); }

  .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
  .links a { color: var(--mute); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .links a:hover { color: var(--ink); }
  .footer-icon { width: 15px; height: 15px; fill: currentColor; }
  .ldot { color: var(--line-hi); font-size: 9px; align-self: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chakraa's HTML Projects</h1>
    <p>Small games and tools that run right in your browser. Nothing to install.</p>
  </header>

  <main>
    <section id="games">
      <h2>Games</h2>
      <div class="grid" id="gamesGrid"></div>
    </section>
    <section id="tools">
      <h2>Tools</h2>
      <div class="grid" id="toolsGrid"></div>
    </section>
  </main>

  <footer class="links">

  </footer>
</div>

<script>
  // To add a project: make games/<Folder>/ or tools/<Folder>/ with <Folder>.html and a preview.jpg, then add a line here.
  const REPO = 'https://github.com/ChakraaThePanda/HTML-Projects/tree/main/';
  const PROJECTS = [
    { kind: 'games', folder: 'Key-Tiles', name: 'Key Tiles',
      text: 'Reflex game: clear the highlighted lane\'s tile before it reaches the bottom while the speed keeps climbing.' },
    { kind: 'games', folder: 'MTG-Decklists', name: 'MTG Decklists',
      text: 'Guessing game built from our past Magic: The Gathering decklists over the years.' },
    { kind: 'games', folder: 'WTTG-K3RN3LC0MP1L3R', name: 'K3RN3L C0MP1L3R',
      text: 'Practice the K3RN3LC0MP1L3R minigame from Welcome to the Game.' },
    { kind: 'tools', folder: 'WoW-Forever-Macro-Creator', name: 'WoW Forever Macro Creator',
      text: 'Build WoW Forever macros from your class spells, with modifier keys, stances and a live 255 character preview.' },
    { kind: 'tools', folder: 'Archipelago-Picker', name: 'Archipelago Picker',
      text: 'Weighted random picker for choosing which games go in your next Archipelago seed.' },
  ];

  for (const p of PROJECTS) {
    const card = document.createElement('article');
    card.className = 'card';
    const dir = `${p.kind}/${p.folder}/`;
    const href = dir + p.folder + '.html';
    card.innerHTML = `
      <img src="${dir}preview.jpg" alt="" loading="lazy" width="600" height="374" />
      <div class="body">
        <h3><a href="${href}"></a></h3>
        <p></p>
        <a class="src" href="${REPO}${dir}" target="_blank" rel="noopener">Source code</a>
      </div>`;
    card.querySelector('h3 a').textContent = p.name;
    card.querySelector('p').textContent = p.text;
    document.getElementById(p.kind + 'Grid').append(card);
  }
</script>
</body>
</html>
